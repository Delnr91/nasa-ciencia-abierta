<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Ciencia abierta en español: dos rutas</title><desc id="desc">Primero Open Science Essentials con cinco lecciones y una evaluación. Después Open Science 101, con su estructura pendiente. Material de estudio independiente.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><rect width="1200" height="164" rx="24" fill="#102b3f"/><text x="48" y="67" font-size="43" fill="#ffffff" font-weight="bold">CIENCIA ABIERTA</text><text x="48" y="117" font-size="27" fill="#d5edf5" font-weight="normal">Comprender · compartir · revisar · aprender</text><rect x="44" y="200" width="538" height="236" rx="20" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="244" font-size="27" fill="#075985" font-weight="bold">01  OPEN SCIENCE ESSENTIALS</text><text x="72" y="294" font-size="26" fill="#0f172a" font-weight="normal">Primero: conceptos esenciales</text><text x="72" y="338" font-size="24" fill="#0f172a" font-weight="normal">5 lecciones + siguientes pasos</text><text x="72" y="380" font-size="23" fill="#0f172a" font-weight="normal">Evaluación: al menos 9 de 12 puntos</text><rect x="614" y="200" width="542" height="236" rx="20" fill="#ede9fe" stroke="#cbd5e1" stroke-width="2"/><text x="642" y="244" font-size="27" fill="#4c1d95" font-weight="bold">02  OPEN SCIENCE 101</text><text x="642" y="294" font-size="26" fill="#0f172a" font-weight="normal">Después: formación extensa</text><text x="642" y="338" font-size="24" fill="#0f172a" font-weight="normal">Ruta independiente de Essentials</text><text x="642" y="380" font-size="23" fill="#0f172a" font-weight="normal">Estructura del estudiante pendiente</text><text x="48" y="494" font-size=