<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Antes de compartir: permisos, sensibilidad y contexto</title><desc id="desc">Tres opciones que requieren evaluación: abrir una versión autorizada, dar acceso controlado o mantener el material protegido. Quitar nombres no garantiza anonimato.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="65" font-size="35" fill="#102b3f" font-weight="bold">LECCIÓN 2 · COMPARTIR CON CRITERIO</text><text x="44" y="111" font-size="24" fill="#334155" font-weight="normal">Primero: ¿quién autoriza?, ¿qué riesgos existen?, ¿qué condiciones aplican?</text><rect x="40" y="176" width="360" height="250" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="58" y="223" font-size="24" fill="#0f172a" font-weight="bold">ABRIR UNA VERSIÓN</text><text x="60" y="280" font-size="23" fill="#0f172a" font-weight="normal">Permisos revisados</text><text x="60" y="324" font-size="23" fill="#0f172a" font-weight="normal">Contexto y licencia</text><text x="60" y="368" font-size="23" fill="#0f172a" font-weight="normal">Límites explicados</text><rect x="420" y="176" width="360" height="250" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="438" y="223" font-size="24" fill="#0f172a" font-weight="bold">ACCESO CONTROLADO</text><text x="440" y="280" font-size="23" fill="#0f172a" font-weight="normal">Requisitos definidos</text><text x="440" y="324" font-size="23" fill="#0f172a" font-weight="normal">Personas autorizadas</text><text x="440" y="368" font-size="23" fill="#0f172a" font-weight="normal">Protecciones acordadas</text><rect x="800" y="176" width="360" height="250" rx="20" fill="#fee2e2" stroke="#cbd5e1" stroke-width="2"/><text x="818" y="223" font-size="24" fill="#0f172a" font-weight="bold">MANTENER PROTEGIDO</text><text x="820" y="280" font-size="23" fill="#0f172a" font-weight="normal">Sin autorización</text><text x="820" y="324" font-size="23" fill="#0f172a" font-weight="normal">o riesgo no resuelto</text><text x="820" y="368" font-size="23" fill="#0f172a" font-weight="normal">Consultar responsables</text><rect x="40" y="464" width="1120" height="100" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="66" y="505" font-size="27" fill="#0f172a" font-weight="bold">Quitar nombres no garantiza anonimato.</text><text x="66" y="542" font-size="24" fill="#334155" font-weight="normal">Compartir conocimiento no exige exponer todos los datos.</text></g></svg>