<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Tres tipos de metadatos</title><desc id="desc">Los descriptivos explican qué significa el dato, los estructurales cómo se organiza y los administrativos cómo se creó y gestionó. Los metadatos también pueden contener información sensible.</desc><rect width="1200" height="610" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="64" font-size="35" fill="#102b3f" font-weight="bold">METADATOS · EL CONTEXTO DEL DATO</text><text x="44" y="112" font-size="25" fill="#334155" font-weight="normal">Un número sin unidad, origen o versión puede resultar ambiguo.</text><rect x="40" y="165" width="360" height="265" rx="20" fill="#e0f2fe" stroke="#cbd5e1"/><text x="57" y="208" font-size="25" fill="#0f172a" font-weight="bold">DESCRIPTIVOS</text><text x="57" y="270" font-size="23" fill="#0f172a" font-weight="normal">¿Qué significa?</text><text x="57" y="315" font-size="23" fill="#0f172a" font-weight="normal">Variable y unidad</text><text x="57" y="360" font-size="23" fill="#0f172a" font-weight="normal">Propósito y límites</text><rect x="420" y="165" width="360" height="265" rx="20" fill="#ede9fe" stroke="#cbd5e1"/><text x="437" y="208" font-size="25" fill="#0f172a" font-weight="bold">ESTRUCTURALES</text><text x="437" y="270" font-size="23" fill="#0f172a" font-weight="normal">¿Cómo se organiza?</text><text x="437" y="315" font-size="23" fill="#0f172a" font-weight="normal">Columnas y dimensiones</text><text x="437" y="360" font-size="23" fill="#0f172a" font-weight="normal">Relaciones entre archivos</text><rect x="800" y="165" width="360" height="265" rx="20" fill="#dcfce7" stroke="#cbd5e1"/><text x="817" y="208" font-size="25" fill="#0f172a" font-weight="bold">ADMINISTRATIVOS</text><text x="817" y="270" font-size="23" fill="#0f172a" font-weight="normal">¿Cómo se gestionó?</text><text x="817" y="315" font-size="23" fill="#0f172a" font-weight="normal">Fecha, software y versión</text><text x="817" y="360" font-size="23" fill="#0f172a" font-weight="normal">Derechos y responsables</text><rect x="40" y="470" width="1120" height="100" rx="20" fill="#ffffff" stroke="#cbd5e1"/><text x="66" y="510" font-size="25" fill="#0f172a" font-weight="normal">Ejemplo: temperatura_c = valor sintético expresado en grados Celsius.</text><text x="66" y="548" font-size="23" fill="#334155" font-weight="normal">También hay que revisar si los metadatos revelan información sensible.</text></g></svg>