<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 778" role="img" aria-labelledby="title desc"><title id="title">Del plan a productos recuperables</title><desc id="desc">Cada producto se relaciona con permisos, versiones, plazos y responsables.</desc><rect width="1000" height="778" rx="24" fill="#101d34"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="58" font-size="29" font-weight="bold" fill="#ffffff">Del plan a productos recuperables</text><text x="40" y="96" font-size="20" fill="#c9daeb">Cada producto se relaciona con permisos, versiones, plazos y responsables.</text><rect x="40" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="189" r="18" fill="#125d75"/><text x="71" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text><text x="101" y="196" font-size="23" font-weight="bold" fill="#12364d">Plan</text><text x="63" y="234" font-size="21" fill="#243b50">Regla aplicable y compromisos.</text><rect x="520" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="189" r="18" fill="#125d75"/><text x="551" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">2</text><text x="581" y="196" font-size="23" font-weight="bold" fill="#12364d">Datos</text><text x="543" y="234" font-size="21" fill="#243b50">Formatos, metadatos y procedencia.</text><rect x="40" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="385" r="18" fill="#125d75"/><text x="71" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">3</text><text x="101" y="392" font-size="23" font-weight="bold" fill="#12364d">Software</text><text x="63" y="430" font-size="21" fill="#243b50">Código, dependencias y evaluación.</text><rect x="520" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="385" r="18" fill="#125d75"/><text x="551" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">4</text><text x="581" y="392" font-size="23" font-weight="bold" fill="#12364d">Publicaciones</text><text x="543" y="430" font-size="21" fill="#243b50">Versiones y vías de acceso.</text><rect x="40" y="547" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="581" r="18" fill="#125d75"/><text x="71" y="588" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">5</text><text x="101" y="588" font-size="23" font-weight="bold" fill="#12364d">Preservación</text><text x="63" y="626" font-size="21" fill="#243b50">Depósito comprobado y correcciones.</text><text x="40" y="760" font-size="17" fill="#c9daeb">Diagrama educativo original · Lee también la explicación escrita junto a la imagen.</text></g></svg>
