<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 582" role="img" aria-labelledby="title desc"><title id="title">Apoyo institucional a la ética</title><desc id="desc">Los compromisos necesitan responsables, recursos y respuesta a problemas.</desc><rect width="1000" height="582" rx="24" fill="#101d34"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="58" font-size="29" font-weight="bold" fill="#ffffff">Apoyo institucional a la ética</text><text x="40" y="96" font-size="20" fill="#c9daeb">Los compromisos necesitan responsables, recursos y respuesta a problemas.</text><rect x="40" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="189" r="18" fill="#125d75"/><text x="71" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text><text x="101" y="196" font-size="23" font-weight="bold" fill="#12364d">Reglas</text><text x="63" y="234" font-size="21" fill="#243b50">Expectativas comprensibles y</text><text x="63" y="259" font-size="21" fill="#243b50">revisables.</text><rect x="520" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="189" r="18" fill="#125d75"/><text x="551" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">2</text><text x="581" y="196" font-size="23" font-weight="bold" fill="#12364d">Recursos</text><text x="543" y="234" font-size="21" fill="#243b50">Tiempo, formación y preservación.</text><rect x="40" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="385" r="18" fill="#125d75"/><text x="71" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">3</text><text x="101" y="392" font-size="23" font-weight="bold" fill="#12364d">Responsables</text><text x="63" y="430" font-size="21" fill="#243b50">Quién prepara, revisa y decide.</text><rect x="520" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="385" r="18" fill="#125d75"/><text x="551" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">4</text><text x="581" y="392" font-size="23" font-weight="bold" fill="#12364d">Respuesta</text><text x="543" y="430" font-size="21" fill="#243b50">Cómo corregir y comunicar un</text><text x="543" y="455" font-size="21" fill="#243b50">problema.</text><text x="40" y="564" font-size="17" fill="#c9daeb">Diagrama educativo original · Lee también la explicación escrita junto a la imagen.</text></g></svg>
