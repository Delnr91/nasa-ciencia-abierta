<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Compartir ayuda a revisar y mejorar</title><desc id="desc">Documentar datos, métodos y código; compartir una versión autorizada; recibir revisión; corregir y reutilizar. La colaboración reconoce los aportes.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="65" font-size="35" fill="#102b3f" font-weight="bold">LECCIÓN 1 · COMPARTIR PARA MEJORAR</text><text x="44" y="112" font-size="25" fill="#334155" font-weight="normal">Abrir el proceso permite comprender cómo se obtuvo un resultado.</text><rect x="40" y="180" width="250" height="222" rx="20" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="2"/><text x="57" y="224" font-size="23" fill="#0f172a" font-weight="bold">1 · DOCUMENTAR</text><text x="57" y="280" font-size="22" fill="#0f172a" font-weight="normal">Datos y unidades</text><text x="57" y="318" font-size="22" fill="#0f172a" font-weight="normal">Método y código</text><path d="M294,286 H319" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="180" width="250" height="222" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="347" y="224" font-size="23" fill="#0f172a" font-weight="bold">2 · COMPARTIR</text><text x="347" y="280" font-size="22" fill="#0f172a" font-weight="normal">Versión autorizada</text><text x="347" y="318" font-size="22" fill="#0f172a" font-weight="normal">Contexto y licencia</text><path d="M584,286 H609" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="620" y="180" width="250" height="222" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="637" y="224" font-size="23" fill="#0f172a" font-weight="bold">3 · REVISAR</text><text x="637" y="280" font-size="22" fill="#0f172a" font-weight="normal">Preguntar y comparar</text><text x="637" y="318" font-size="22" fill="#0f172a" font-weight="normal">Buscar errores</text><path d="M874,286 H899" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="910" y="180" width="250" height="222" rx="20" fill="#ede9fe" stroke="#cbd5e1" stroke-width="2"/><text x="927" y="224" font-size="23" fill="#0f172a" font-weight="bold">4 · MEJORAR</text><text x="927" y="280" font-size="22" fill="#0f172a" font-weight="normal">Corregir y reutilizar</text><text x="927" y="318" font-size="22" fill="#0f172a" font-weight="normal">Reconocer aportes</text><rect x="40" y="450" width="1120" height="102" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="66" y="490" font-size="25" fill="#0f172a" font-weight="bold">Idea clave: no basta con ver el resultado.</text><text x="66" y="527" font-size="24" fill="#334155" font-weight="normal">También necesitamos saber de dónde viene y cómo se produjo.</text></g></svg>