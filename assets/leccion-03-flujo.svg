<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Planificar, implementar y publicar: un ciclo revisable</title><desc id="desc">Planificar productos y responsabilidades; implementar con documentación y revisión; publicar versiones autorizadas. Los hallazgos pueden hacer volver a la planificación. La apertura responsable atraviesa todo el proceso.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1200" height="650" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="64" font-size="34" fill="#102b3f" font-weight="bold">LECCIÓN 3 · PLANIFICAR DESDE EL COMIENZO</text><text x="44" y="111" font-size="24" fill="#334155" font-weight="normal">El proceso puede volver atrás: investigar también es revisar decisiones.</text><rect x="40" y="170" width="340" height="230" rx="20" fill="#e0f2fe" stroke="#cbd5e1"/><text x="60" y="216" font-size="27" fill="#0f172a" font-weight="bold">1 · PLANIFICAR</text><text x="60" y="267" font-size="24" fill="#0f172a" font-weight="normal">Pregunta y productos</text><text x="60" y="307" font-size="24" fill="#0f172a" font-weight="normal">Roles y permisos</text><text x="60" y="347" font-size="24" fill="#0f172a" font-weight="normal">Recursos y calendario</text><path d="M385,280 H410" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="170" width="340" height="230" rx="20" fill="#dcfce7" stroke="#cbd5e1"/><text x="440" y="216" font-size="27" fill="#0f172a" font-weight="bold">2 · IMPLEMENTAR</text><text x="440" y="267" font-size="24" fill="#0f172a" font-weight="normal">Datos y análisis</text><text x="440" y="307" font-size="24" fill="#0f172a" font-weight="normal">Versiones y pruebas</text><text x="440" y="347" font-size="24" fill="#0f172a" font-weight="normal">Documentación</text><path d="M765,280 H790" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="170" width="340" height="230" rx="20" fill="#ede9fe" stroke="#cbd5e1"/><text x="820" y="216" font-size="27" fill="#0f172a" font-weight="bold">3 · PUBLICAR</text><text x="820" y="267" font-size="24" fill="#0f172a" font-weight="normal">Versión autorizada</text><text x="820" y="307" font-size="24" fill="#0f172a" font-weight="normal">Depósito y citación</text><text x="820" y="347" font-size="24" fill="#0f172a" font-weight="normal">Límites y condiciones</text><path d="M970,408 V444 H210 V408" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="424" y="481" font-size="24" fill="#334155" font-weight="bold">REVISAR Y AJUSTAR EL PLAN</text><rect x="40" y="516" width="1120" height="90" rx="20" fill="#ffffff" stroke="#cbd5e1"/><text x="66" y="554" font-size="25" fill="#0f172a" font-weight="normal">En todas las fases: documentar, acordar y reconocer contribuciones.</text><text x="66" y="587" font-size="23" fill="#334155" font-weight="normal">Compartir requiere permisos y protección de lo que corresponde.</text></g></svg>