<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Material, autorización, licencia y condiciones</title><desc id="desc">Cuatro preguntas antes de compartir: qué material tengo, quién puede autorizarlo, qué licencia corresponde y qué avisos deben conservarse. Público no significa permiso general de reutilización.</desc><rect width="1200" height="570" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif" fill="#0f172a"><text x="44" y="64" font-size="35" font-weight="bold">ANEXO 2A · PERMISOS ANTES DE PUBLICAR</text><text x="44" y="110" font-size="25" fill="#334155">Que puedas verlo no significa que puedas reutilizarlo de cualquier forma.</text><rect x="40" y="152" width="544" height="146" rx="20" fill="#e0f2fe"/><text x="62" y="196" font-size="27" font-weight="bold">1 · ¿QUÉ MATERIAL ES?</text><text x="62" y="248" font-size="25">Código, texto, imagen o datos</text><rect x="616" y="152" width="544" height="146" rx="20" fill="#ede9fe"/><text x="638" y="196" font-size="27" font-weight="bold">2 · ¿QUIÉN AUTORIZA?</text><text x="638" y="248" font-size="25">Titulares y acuerdos aplicables</text><rect x="40" y="322" width="544" height="146" rx="20" fill="#dcfce7"/><text x="62" y="366" font-size="27" font-weight="bold">3 · ¿QUÉ LICENCIA TIENE?</text><text x="62" y="418" font-size="25">Permisos y alcance de cada parte</text><rect x="616" y="322" width="544" height="146" rx="20" fill="#fef3c7"/><text x="638" y="366" font-size="27" font-weight="bold">4 · ¿QUÉ DEBO CONSERVAR?</text><text x="638" y="418" font-size="25">Avisos, atribución y condiciones</text><text x="44" y="527" font-size="24" fill="#334155">Si faltan permisos o hay restricciones, consulta antes de compartir.</text></g></svg>