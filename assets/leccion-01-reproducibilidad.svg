<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Reproducibilidad frente a replicabilidad</title><desc id="desc">Reproducibilidad computacional: mismos datos y procedimiento original. Replicabilidad: nuevos datos para contrastar la misma pregunta, según la convención NASEM 2019.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="66" font-size="36" fill="#102b3f" font-weight="bold">DOS FORMAS DE COMPROBAR</text><text x="44" y="111" font-size="24" fill="#334155" font-weight="normal">Convención del informe de las Academias Nacionales, 2019.</text><rect x="40" y="156" width="1120" height="168" rx="20" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="2"/><text x="66" y="199" font-size="27" fill="#075985" font-weight="bold">REPRODUCIBILIDAD COMPUTACIONAL</text><text x="66" y="250" font-size="26" fill="#0f172a" font-weight="normal">Mismos datos + código + pasos + condiciones</text><text x="66" y="291" font-size="24" fill="#0f172a" font-weight="normal">¿Podemos obtener resultados consistentes al repetir el análisis?</text><rect x="40" y="350" width="1120" height="168" rx="20" fill="#ede9fe" stroke="#cbd5e1" stroke-width="2"/><text x="66" y="394" font-size="27" fill="#4c1d95" font-weight="bold">REPLICABILIDAD</text><text x="66" y="443" font-size="26" fill="#0f172a" font-weight="normal">Nuevos datos + estudios sobre la misma pregunta</text><text x="66" y="484" font-size="24" fill="#0f172a" font-weight="normal">¿Los resultados de otros estudios son consistentes?</text><text x="44" y="574" font-size="24" fill="#334155" font-weight="normal">Repetir un resultado no demuestra por sí solo que el método sea correcto.</text></g></svg>