<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Tres rutas de acceso abierto</title><desc id="desc">Verde: depósito de una versión autorizada. Dorada: publicación abierta en la revista. Diamante: sin cobro al lector ni al autor. Las etiquetas pueden solaparse y no toda vía dorada exige pagar al autor.</desc><rect width="1200" height="590" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="64" font-size="32" fill="#102b3f" font-weight="bold">ACCESO ABIERTO · REVISAR LA VÍA Y LOS DERECHOS</text><rect x="40" y="120" width="360" height="265" rx="20" fill="#dcfce7" stroke="#cbd5e1"/><text x="60" y="165" font-size="30" fill="#0f172a" font-weight="bold">VERDE</text><text x="60" y="225" font-size="24" fill="#0f172a" font-weight="normal">Autoarchivo</text><text x="60" y="273" font-size="24" fill="#0f172a" font-weight="normal">Versión autorizada</text><text x="60" y="321" font-size="24" fill="#0f172a" font-weight="normal">Revisar posible embargo</text><rect x="420" y="120" width="360" height="265" rx="20" fill="#fef3c7" stroke="#cbd5e1"/><text x="440" y="165" font-size="30" fill="#0f172a" font-weight="bold">DORADA</text><text x="440" y="225" font-size="24" fill="#0f172a" font-weight="normal">Abierto en la revista</text><text x="440" y="273" font-size="24" fill="#0f172a" font-weight="normal">Revisar financiación</text><text x="440" y="321" font-size="24" fill="#0f172a" font-weight="normal">No siempre exige APC</text><rect x="800" y="120" width="360" height="265" rx="20" fill="#e0f2fe" stroke="#cbd5e1"/><text x="820" y="165" font-size="30" fill="#0f172a" font-weight="bold">DIAMANTE</text><text x="820" y="225" font-size="24" fill="#0f172a" font-weight="normal">Sin cobro al lector</text><text x="820" y="273" font-size="24" fill="#0f172a" font-weight="normal">Sin cobro al autor</text><text x="820" y="321" font-size="24" fill="#0f172a" font-weight="normal">Revisar condiciones</text><text x="44" y="447" font-size="25" fill="#334155" font-weight="normal">Diamante puede considerarse una modalidad sin APC de publicación</text><text x="44" y="485" font-size="25" fill="#334155" font-weight="normal">abierta en revistas. Las categorías no siempre son excluyentes.</text><text x="44" y="544" font-size="24" fill="#102b3f" font-weight="bold">Acceso abierto no garantiza revisión por pares ni reproducibilidad.</text></g></svg>