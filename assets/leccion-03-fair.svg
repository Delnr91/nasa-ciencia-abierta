<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">FAIR: cuatro preguntas para reutilizar datos</title><desc id="desc">Encontrable: localizar. Accesible: conocer el procedimiento de acceso, con autorización si corresponde. Interoperable: interpretar y combinar. Reutilizable: condiciones y procedencia. FAIR no significa datos siempre públicos.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1200" height="590" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="64" font-size="34" fill="#102b3f" font-weight="bold">FAIR · CUATRO PREGUNTAS PARA LOS DATOS</text><rect x="40" y="110" width="544" height="176" rx="20" fill="#e0f2fe" stroke="#cbd5e1"/><text x="60" y="153" font-size="28" fill="#0f172a" font-weight="bold">F · ENCONTRABLE</text><text x="60" y="204" font-size="24" fill="#0f172a" font-weight="normal">¿Puedo localizarlo?</text><text x="60" y="247" font-size="23" fill="#334155" font-weight="normal">Identificador y metadatos</text><rect x="616" y="110" width="544" height="176" rx="20" fill="#dcfce7" stroke="#cbd5e1"/><text x="636" y="153" font-size="28" fill="#0f172a" font-weight="bold">A · ACCESIBLE</text><text x="636" y="204" font-size="24" fill="#0f172a" font-weight="normal">¿Cómo puedo acceder?</text><text x="636" y="247" font-size="23" fill="#334155" font-weight="normal">Con autorización si corresponde</text><rect x="40" y="310" width="544" height="176" rx="20" fill="#ede9fe" stroke="#cbd5e1"/><text x="60" y="353" font-size="28" fill="#0f172a" font-weight="bold">I · INTEROPERABLE</text><text x="60" y="404" font-size="24" fill="#0f172a" font-weight="normal">¿Puedo interpretarlo y combinarlo?</text><text x="60" y="447" font-size="23" fill="#334155" font-weight="normal">Significados y vocabularios claros</text><rect x="616" y="310" width="544" height="176" rx="20" fill="#fef3c7" stroke="#cbd5e1"/><text x="636" y="353" font-size="28" fill="#0f172a" font-weight="bold">R · REUTILIZABLE</text><text x="636" y="404" font-size="24" fill="#0f172a" font-weight="normal">¿Sirve para este nuevo uso?</text><text x="636" y="447" font-size="23" fill="#334155" font-weight="normal">Condiciones y procedencia</text><text x="44" y="548" font-size="24" fill="#334155" font-weight="normal">FAIR no exige apertura irrestricta ni certifica que un resultado sea correcto.</text></g></svg>