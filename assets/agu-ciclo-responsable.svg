<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 778" role="img" aria-labelledby="title desc"><title id="title">Investigar con responsabilidad</title><desc id="desc">La ética acompaña las decisiones antes, durante y después del análisis.</desc><rect width="1000" height="778" rx="24" fill="#101d34"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="58" font-size="29" font-weight="bold" fill="#ffffff">Investigar con responsabilidad</text><text x="40" y="96" font-size="20" fill="#c9daeb">La ética acompaña las decisiones antes, durante y después del análisis.</text><rect x="40" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="189" r="18" fill="#125d75"/><text x="71" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text><text x="101" y="196" font-size="23" font-weight="bold" fill="#12364d">Finalidad</text><text x="63" y="234" font-size="21" fill="#243b50">Define una pregunta y sus límites.</text><rect x="520" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="189" r="18" fill="#125d75"/><text x="551" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">2</text><text x="581" y="196" font-size="23" font-weight="bold" fill="#12364d">Documentación</text><text x="543" y="234" font-size="21" fill="#243b50">Conserva datos, versiones y</text><text x="543" y="259" font-size="21" fill="#243b50">decisiones.</text><rect x="40" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="385" r="18" fill="#125d75"/><text x="71" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">3</text><text x="101" y="392" font-size="23" font-weight="bold" fill="#12364d">Evaluación</text><text x="63" y="430" font-size="21" fill="#243b50">Busca pruebas y casos de fallo.</text><rect x="520" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="385" r="18" fill="#125d75"/><text x="551" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">4</text><text x="581" y="392" font-size="23" font-weight="bold" fill="#12364d">Participación</text><text x="543" y="430" font-size="21" fill="#243b50">Incorpora voces y derechos</text><text x="543" y="455" font-size="21" fill="#243b50">pertinentes.</text><rect x="40" y="547" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="581" r="18" fill="#125d75"/><text x="71" y="588" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">5</text><text x="101" y="588" font-size="23" font-weight="bold" fill="#12364d">Comunicación</text><text x="63" y="626" font-size="21" fill="#243b50">Explica incertidumbre y usos</text><text x="63" y="651" font-size="21" fill="#243b50">previstos.</text><rect x="520" y="547" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="581" r="18" fill="#125d75"/><text x="551" y="588" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">6</text><text x="581" y="588" font-size="23" font-weight="bold" fill="#12364d">Seguimiento</text><text x="543" y="626" font-size="21" fill="#243b50">Recibe avisos y revisa</text><text x="543" y="651" font-size="21" fill="#243b50">consecuencias.</text><text x="40" y="760" font-size="17" fill="#c9daeb">Diagrama educativo original · Lee también la explicación escrita junto a la imagen.</text></g></svg>
