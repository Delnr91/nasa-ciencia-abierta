<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 582" role="img" aria-labelledby="title desc"><title id="title">Permisos según el producto</title><desc id="desc">Revisa titularidad y condiciones antes de compartir o combinar materiales.</desc><rect width="1000" height="582" rx="24" fill="#101d34"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="58" font-size="29" font-weight="bold" fill="#ffffff">Permisos según el producto</text><text x="40" y="96" font-size="20" fill="#c9daeb">Revisa titularidad y condiciones antes de compartir o combinar materiales.</text><rect x="40" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="189" r="18" fill="#125d75"/><text x="71" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text><text x="101" y="196" font-size="23" font-weight="bold" fill="#12364d">Textos y datos</text><text x="63" y="234" font-size="21" fill="#243b50">Comprueba la licencia y los</text><text x="63" y="259" font-size="21" fill="#243b50">derechos que puedes conceder.</text><rect x="520" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="189" r="18" fill="#125d75"/><text x="551" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">2</text><text x="581" y="196" font-size="23" font-weight="bold" fill="#12364d">Código</text><text x="543" y="234" font-size="21" fill="#243b50">Usa condiciones apropiadas al</text><text x="543" y="259" font-size="21" fill="#243b50">software y sus dependencias.</text><rect x="40" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="385" r="18" fill="#125d75"/><text x="71" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">3</text><text x="101" y="392" font-size="23" font-weight="bold" fill="#12364d">Materiales ajenos</text><text x="63" y="430" font-size="21" fill="#243b50">Conserva atribuciones y permisos</text><text x="63" y="455" font-size="21" fill="#243b50">específicos.</text><rect x="520" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="385" r="18" fill="#125d75"/><text x="551" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">4</text><text x="581" y="392" font-size="23" font-weight="bold" fill="#12364d">Revisión</text><text x="543" y="430" font-size="21" fill="#243b50">Una licencia no garantiza calidad</text><text x="543" y="455" font-size="21" fill="#243b50">ni autoriza datos sensibles.</text><text x="40" y="564" font-size="17" fill="#c9daeb">Diagrama educativo original · Lee también la explicación escrita junto a la imagen.</text></g></svg>
