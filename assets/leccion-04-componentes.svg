<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Cuatro componentes de investigación conectados</title><desc id="desc">El artículo o informe resume la relación entre datos, resultados y código. Los datos y el software también pueden ser resultados de investigación. La pirámide no implica una jerarquía de valor.</desc><rect width="1200" height="710" rx="24" fill="#f8fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="60" font-size="34" fill="#102b3f" font-weight="bold">LECCIÓN 4 · PRODUCTOS QUE SE CONECTAN</text><path d="M600,112 L350,340 L850,340 Z" fill="#fef3c7" stroke="#64748b" stroke-width="2"/><text x="523" y="268" font-size="30" fill="#713f12" font-weight="bold">ARTÍCULO</text><text x="517" y="310" font-size="24" fill="#713f12" font-weight="normal">o informe</text><path d="M350,340 L516.7,340 L433.3,568 L100,568 Z" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><path d="M516.7,340 L683.3,340 L766.7,568 L433.3,568 Z" fill="#ede9fe" stroke="#64748b" stroke-width="2"/><path d="M683.3,340 L850,340 L1100,568 L766.7,568 Z" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="235" y="469" font-size="30" fill="#14532d" font-weight="bold">DATOS</text><text x="505" y="469" font-size="28" fill="#4c1d95" font-weight="bold">RESULTADOS</text><text x="840" y="469" font-size="30" fill="#7f1d1d" font-weight="bold">CÓDIGO</text><text x="164" y="532" font-size="21" fill="#14532d" font-weight="normal">¿Con qué trabajamos?</text><text x="484" y="532" font-size="23" fill="#4c1d95" font-weight="normal">¿Qué obtuvimos?</text><text x="823" y="532" font-size="21" fill="#7f1d1d" font-weight="normal">¿Cómo calculamos?</text><text x="44" y="626" font-size="26" fill="#0f172a" font-weight="bold">Datos y software también pueden ser resultados.</text><text x="44" y="666" font-size="24" fill="#334155" font-weight="normal">La forma resume relaciones; no indica qué contribución vale más.</text></g></svg>