<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 582" role="img" aria-labelledby="title desc"><title id="title">Aprender para poder actuar</title><desc id="desc">Una sesión útil produce una decisión o evidencia que otra persona puede revisar.</desc><rect width="1000" height="582" rx="24" fill="#101d34"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="58" font-size="29" font-weight="bold" fill="#ffffff">Aprender para poder actuar</text><text x="40" y="96" font-size="20" fill="#c9daeb">Una sesión útil produce una decisión o evidencia que otra persona puede revisar.</text><rect x="40" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="189" r="18" fill="#125d75"/><text x="71" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text><text x="101" y="196" font-size="23" font-weight="bold" fill="#12364d">Comprender</text><text x="63" y="234" font-size="21" fill="#243b50">Explicación clara y un ejemplo.</text><rect x="520" y="155" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="189" r="18" fill="#125d75"/><text x="551" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">2</text><text x="581" y="196" font-size="23" font-weight="bold" fill="#12364d">Practicar</text><text x="543" y="234" font-size="21" fill="#243b50">Resolver una situación concreta.</text><rect x="40" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="71" cy="385" r="18" fill="#125d75"/><text x="71" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">3</text><text x="101" y="392" font-size="23" font-weight="bold" fill="#12364d">Revisar</text><text x="63" y="430" font-size="21" fill="#243b50">Explicar y comprobar la decisión.</text><rect x="520" y="351" width="440" height="172" rx="14" fill="#f5f8fc"/><circle cx="551" cy="385" r="18" fill="#125d75"/><text x="551" y="392" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">4</text><text x="581" y="392" font-size="23" font-weight="bold" fill="#12364d">Actualizar</text><text x="543" y="430" font-size="21" fill="#243b50">Registrar dudas y mejorar recursos.</text><text x="40" y="564" font-size="17" fill="#c9daeb">Diagrama educativo original · Lee también la explicación escrita junto a la imagen.</text></g></svg>
